name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
          - profile

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Create signing config
        run: |
          printf 'storePassword=brarchive2024\nkeyPassword=brarchive2024\nkeyAlias=upload\nstoreFile=upload-keystore.jks\n' > android/key.properties

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Determine build type
        id: bt
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ inputs.build_type }}" >> $GITHUB_OUTPUT
          else
            echo "type=release" >> $GITHUB_OUTPUT
          fi

      - name: Build APK
        run: flutter build apk --${{ steps.bt.outputs.type }}

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-${{ steps.bt.outputs.type }}.apk \
            artifacts/brarchive-android-${{ steps.bt.outputs.type }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/*.apk
          retention-days: 30

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false

  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Determine build type
        id: bt
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ inputs.build_type }}" >> $GITHUB_OUTPUT
          else
            echo "type=release" >> $GITHUB_OUTPUT
          fi

      - name: Build Windows
        run: flutter build windows --${{ steps.bt.outputs.type }}

      - name: Package Windows app
        shell: pwsh
        run: |
          $buildType = '${{ steps.bt.outputs.type }}'
          $outDir = "artifacts/brarchive-windows-$buildType"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          Copy-Item -Path "build\windows\x64\runner\Release\*" -Destination $outDir -Recurse
          Compress-Archive -Path "$outDir\*" -DestinationPath "artifacts/brarchive-windows-$buildType.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: artifacts/*.zip
          retention-days: 30

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: false

  build-linux:
    name: Build Linux App
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config

      - name: Get dependencies
        run: flutter pub get

      - name: Create Linux platform files
        run: flutter create --platforms=linux --org com.wisebreeze --project-name brarchive .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Determine build type
        id: bt
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ inputs.build_type }}" >> $GITHUB_OUTPUT
          else
            echo "type=release" >> $GITHUB_OUTPUT
          fi

      - name: Build Linux
        run: flutter build linux --${{ steps.bt.outputs.type }}

      - name: Package Linux app
        run: |
          mkdir -p artifacts
          cd build/linux/x64/release/bundle
          tar czf ../../../artifacts/brarchive-linux-${{ steps.bt.outputs.type }}.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: artifacts/*.tar.gz
          retention-days: 30

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: false

  build-ios:
    name: Build iOS (unsigned)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Create iOS platform files
        run: flutter create --platforms=ios --org com.wisebreeze --project-name brarchive .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package iOS app
        run: |
          mkdir -p artifacts
          cd build/ios/iphoneos
          zip -r ../../../artifacts/brarchive-ios-release.zip Runner.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: artifacts/*.zip
          retention-days: 30

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: false

  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Create macOS platform files
        run: flutter create --platforms=macos --org com.wisebreeze --project-name brarchive .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build macOS
        run: flutter build macos --release

      - name: Package macOS app
        run: |
          mkdir -p artifacts
          cd build/macos/Build/Products/Release
          zip -r -y ../../../artifacts/brarchive-macos-release.zip brarchive.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: artifacts/*.zip
          retention-days: 30

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: false
